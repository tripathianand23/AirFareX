name: Daily AirFareX Pipeline

on:
  schedule:
    # 08:00 AM IST = 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download existing raw data from R2
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import boto3

          project_root = Path.cwd()
          raw_path = project_root / "data/raw/airfare_index.json"
          raw_path.parent.mkdir(parents=True, exist_ok=True)

          account_id = os.environ["R2_ACCOUNT_ID"]
          access_key = os.environ["R2_ACCESS_KEY_ID"]
          secret_key = os.environ["R2_SECRET_ACCESS_KEY"]
          bucket = os.environ["R2_BUCKET"]

          endpoint = f"https://{account_id}.r2.cloudflarestorage.com"

          s3 = boto3.client(
              "s3",
              endpoint_url=endpoint,
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              region_name="auto",
          )

          print("Downloading existing raw airfare data from R2...")

          s3.download_file(
              bucket,
              "raw/airfare_index.json",
              str(raw_path),
          )

          size_mb = raw_path.stat().st_size / (1024 * 1024)

          print(f"Downloaded: {raw_path}")
          print(f"Size: {size_mb:.2f} MB")
          print("Raw data download completed.")
          PYTHON

      - name: Fetch latest API data
        id: fetch
        shell: bash
        run: |
          set +e

          python scripts/fetch_friend_api.py
          FETCH_RC=$?

          set -e

          if [ "$FETCH_RC" -eq 2 ]; then
            echo "No new API records."
            echo "skip_pipeline=true" >> "$GITHUB_OUTPUT"
          elif [ "$FETCH_RC" -ne 0 ]; then
            echo "fetch_friend_api.py failed with exit code $FETCH_RC"
            exit "$FETCH_RC"
          else
            echo "New API data fetched successfully."
            echo "skip_pipeline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run real data pipeline
        if: steps.fetch.outputs.skip_pipeline != 'true'
        run: |
          python scripts/run_real_pipeline.py

      - name: Build airfare index
        if: steps.fetch.outputs.skip_pipeline != 'true'
        run: |
          python scripts/build_real_airfare_index.py

      - name: Build clean Parquet
        if: steps.fetch.outputs.skip_pipeline != 'true'
        run: |
          python scripts/build_clean_parquet.py

      - name: Upload data and index artifacts to R2
        if: steps.fetch.outputs.skip_pipeline != 'true'
        run: |
          python scripts/upload_to_r2.py

      - name: Commit updated index artifacts
        if: steps.fetch.outputs.skip_pipeline != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u data/processed/real/index data/reports/real

          if git diff --cached --quiet; then
            echo "No tracked index/report changes to commit."
          else
            git commit -m "chore: daily airfare pipeline refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          fi

      - name: Push updated index artifacts
        if: steps.fetch.outputs.skip_pipeline != 'true'
        run: |
          git push origin HEAD:main
